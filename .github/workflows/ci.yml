# Omahedron CI: package build and non-VM checks before release validation.
# Full system and VM checks are manual; VM runs verify native KVM first.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      validation:
        description: Validation scope (VM results are a pre-gate, not metal sign-off)
        type: choice
        default: light
        options:
          - light
          - preflight
          - system
          - fish
          - desktop
          - ux
          - all

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.validation || 'light' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks-light:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.validation == 'light' }}
    name: checks-light (non-VM)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      # magic-nix-cache: GHA cache 418 throttle can hang the Post step for 20m+.
      # Prefer flake/binary caches; keep installer only until cache is stable.
      # - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: flake show
        run: nix flake show --all-systems

      - name: formatter
        run: nix fmt -- --ci .

      - name: package omarchy
        run: nix build -L .#packages.x86_64-linux.omarchy

      - name: non-VM checks (x86_64-linux)
        run: |
          set -euo pipefail
          # VM harnesses run through the manual checks-system job below.
          # Run the manifest / package / eval checks already defined in flake.nix.
          checks=(
            omarchy-skill
            catalog-consistency
            omarchy-migrations
            omarchy-shebangs
            omarchy-pam-eval
            omarchy-binfmt-eval
            omarchy-migration-parity
            omarchy-etc-parity
            omarchy-disabled-state
            omarchy-runtime
            omarchy-nix-transactions
            omarchy-flake-resolver
            omarchy-option-validation
            omarchy-options-documented
            omarchy-fish-package
            omarchy-fish-parity
            omarchy-fish-module
          )
          for c in "${checks[@]}"; do
            echo "::group::check $c"
            nix build -L ".#checks.x86_64-linux.$c"
            echo "::endgroup::"
          done

  checks-system:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.validation != 'light' }}
    name: checks-system (${{ inputs.validation }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      VALIDATION: ${{ inputs.validation }}
    steps:
      - name: Check native KVM and storage
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          free -h
          df -h /
          if [ "$VALIDATION" != preflight ]; then
            available=$(df -B1 --output=avail / | tail -n 1)
            if (( available < 35 * 1024 * 1024 * 1024 )); then
              echo 'Full system/VM builds require at least 35 GiB free on this runner.' >&2
              exit 1
            fi
          fi
          # A system closure build does not need virtualization.
          if [ "$VALIDATION" = system ]; then exit 0; fi
          test -c /dev/kvm
          # This ephemeral runner must expose KVM to Nix's build users too.
          sudo chmod a+rw /dev/kvm
          python3 - <<'PY'
          import fcntl
          import os

          kvm = os.open('/dev/kvm', os.O_RDWR | os.O_CLOEXEC)
          assert fcntl.ioctl(kvm, 0xAE00, 0) == 12, 'unsupported KVM API'
          vm = fcntl.ioctl(kvm, 0xAE01, 0)
          os.close(vm)
          os.close(kvm)
          print('PASS: native x86_64 KVM can create a VM')
          PY

      - uses: actions/checkout@v4
        if: ${{ inputs.validation != 'preflight' }}

      - uses: DeterminateSystems/nix-installer-action@main
        if: ${{ inputs.validation != 'preflight' }}

      - name: Full example system
        if: ${{ inputs.validation == 'system' || inputs.validation == 'all' }}
        run: |
          set -euo pipefail
          mkdir -p validation-logs
          nix build -L --keep-going --max-jobs 2 --cores 2 --out-link result-system \
            .#nixosConfigurations.example.config.system.build.toplevel \
            2>&1 | tee validation-logs/system.log

      - name: NixOS VM tests
        if: ${{ contains(fromJSON('["fish", "desktop", "ux", "all"]'), inputs.validation) }}
        run: |
          set -euo pipefail
          mkdir -p validation-logs
          if [ "$VALIDATION" = all ]; then
            suites=(fish desktop ux)
          else
            suites=("$VALIDATION")
          fi
          failed=0
          for suite in "${suites[@]}"; do
            if ! nix build -L --keep-going --max-jobs 2 --cores 2 \
              --out-link "result-$suite" ".#checks.x86_64-linux.omarchy-$suite" \
              2>&1 | tee "validation-logs/$suite.log"; then
              failed=1
            fi
          done
          exit "$failed"

      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.validation != 'preflight' }}
        with:
          name: validation-${{ inputs.validation }}-${{ github.sha }}
          path: validation-logs
          if-no-files-found: ignore
          retention-days: 7
