# Omahedron CI: theme layout and the thin install flake.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  theme-pack:
    name: theme pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: theme layout
        run: bash checks/theme-layout.sh

      - uses: DeterminateSystems/nix-installer-action@main

      - name: flake show
        run: nix flake show --all-systems

      - name: formatter
        run: nix fmt -- --ci .

      - name: flake check
        run: nix flake check

      - name: package themes
        run: nix build -L .#omahedron-themes
