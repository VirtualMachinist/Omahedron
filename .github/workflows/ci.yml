# Omahedron CI: theme layout and the thin install flake.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  theme-pack:
    name: theme pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: theme layout
        run: bash checks/theme-layout.sh

      - uses: DeterminateSystems/nix-installer-action@main

      - name: flake show
        run: nix flake show --all-systems

      - name: formatter
        run: nix fmt -- --ci .

      - name: flake check
        run: nix flake check

      - name: package themes
        run: nix build -L .#omahedron-themes

      # Linux-only. Builds the archived os-port package (not the desktop
      # test suite) and checks the installed menu plus packaged scripts.
      - name: os-port deno hardening
        run: |
          nix build -L ./legacy/os-port#omarchy -o "$RUNNER_TEMP/omarchy-pkg"
          bash checks/os-port-deno-menu.sh "$RUNNER_TEMP/omarchy-pkg"
